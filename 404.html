<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Perdido no mapa | Bovary Club Society</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05050a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .err-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }
    .err-code {
      font-family: var(--font-display, Orbitron, sans-serif);
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
      background: linear-gradient(135deg, #a78bfa, #38bdf8, #e879f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }
    .err-title {
      font-family: var(--font-display, Orbitron, sans-serif);
      font-size: clamp(18px, 4vw, 28px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #e8f0ff;
    }
    .err-text {
      color: var(--text-dim, #94a3b8);
      max-width: 420px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="err-wrap">
    <div class="err-code">404</div>
    <h1 class="err-title">Você se perdeu no mapa</h1>
    <p class="err-text">Essa rota não existe (ou o meet já acabou). Volta pra home e encontra a crew de novo.</p>
    <div class="err-actions">
      <a href="index.html" class="btn-primary">← VOLTAR PRA HOME</a>
      <a href="index.html#crews" class="btn-secondary">FRIENDLY CREWS</a>
    </div>
  </div>
</body>
</html>
